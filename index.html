<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfonox Slovakia</title>
    
    <!-- Ikona v tabe prehliadača (Favicon) -->
    <link rel="icon" type="image/png" href="wbsitelogo.png">
    <!-- Ikona pre mobilné zariadenia (Apple) -->
    <link rel="apple-touch-icon" href="wbsitelogo.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Horizontálne v strede */
            align-items: flex-start; /* Umiestnenie na začiatok (hore) */
            min-height: 100vh;
            
            /* Modrý filter nad obrázkom pozadia */
            background: 
                linear-gradient(rgba(0, 102, 255, 0.7), rgba(0, 102, 255, 0.7)), 
                url('gdbackround.png');
            
            background-color: #0066ff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .logo-container {
            margin-top: 30px; /* Odstup loga od úplného vrchu */
            display: flex;
            flex-direction: column; /* Usporiada logo a tlačidlo pod seba */
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo-img {
            max-width: 80%;
            height: auto;
            /* Jemný tieň pod logom */
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
        }

        .gd-button {
            margin-top: 40px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 280px;
            height: 90px;
            background-image: url('Button_template3.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            text-decoration: none;
            color: #ffffff;
            font-family: 'Arial Black', 'Impact', sans-serif;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 3px 5px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
            filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.4));
            user-select: none;
        }

        /* Efekt stlačenia tlačidla */
        .gd-button:hover {
            transform: scale(1.05);
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6)) brightness(1.1);
        }

        .gd-button:active {
            transform: scale(0.95);
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.4));
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Zmenené na nové logo logodelfonsk.png -->
        <img class="logo-img" src="logodelfonsk.png" alt="Logo Delfonox" onerror="this.style.border='2px dashed white';">
        
        <!-- Tlačidlo pre Texture Pack -->
        <a href="#" class="gd-button">
            Môj texture pack
        </a>
    </div>

</body>
</html>
