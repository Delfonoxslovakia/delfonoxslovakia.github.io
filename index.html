<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delfonox Slovakia</title>
    
    <link rel="icon" type="image/png" href="wbsitelogo.png">
    <link rel="apple-touch-icon" href="wbsitelogo.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            
            background: 
                linear-gradient(rgba(0, 102, 255, 0.7), rgba(0, 102, 255, 0.7)), 
                url('gdbackround.png');
            
            background-color: #0066ff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Arial Black', 'Impact', sans-serif;
        }

        .logo-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo-img {
            max-width: 80%;
            height: auto;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
        }

        .gd-button {
            margin-top: 40px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 269px;
            height: 270px;
            background-image: url('Button_template3.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            text-decoration: none;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000, 0px 3px 5px rgba(0,0,0,0.8);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.1s ease;
            filter: drop-shadow(0px 6px 10px rgba(0,0,0,0.4));
            user-select: none;
            border: none;
            outline: none;
        }

        .gd-button:hover {
            transform: scale(1.05);
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.6)) brightness(1.1);
        }

        .gd-button:active {
            transform: scale(0.95);
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.4));
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #002266;
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 25px 30px;
            max-width: 320px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.7);
            transform: scale(0.8);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-text {
            font-size: 18px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #000;
            line-height: 1.4;
        }

        .modal-btn {
            background: #00cc44;
            color: white;
            border: 2px solid #000;
            padding: 8px 24px;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 6px;
            text-shadow: 1px 1px 0px #000;
            box-shadow: 0px 4px 0px #008822;
            transition: transform 0.1s ease, background 0.1s ease;
        }

        .modal-btn:hover {
            background: #00ee55;
        }

        .modal-btn:active {
            transform: translateY(2px);
            box-shadow: 0px 2px 0px #008822;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img class="logo-img" src="logodelfonsk.png" alt="Logo Delfonox" onerror="this.style.border='2px dashed white';">
        
        <button class="gd-button" onclick="showNotice()">
            Môj texture pack
        </button>
    </div>

    <div class="modal-overlay" id="noticeModal">
        <div class="modal-box">
            <div class="modal-text">Tento obsah je zatiaľ nedostupný. Ospravedlňujeme sa.</div>
            <button class="modal-btn" onclick="closeNotice()">OK</button>
        </div>
    </div>

    <script>
        function showNotice() {
            document.getElementById('noticeModal').classList.add('active');
        }

        function closeNotice() {
            document.getElementById('noticeModal').classList.remove('active');
        }
    </script>

</body>
</html>
